<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Film Generator - InnChanger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: white;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00ffcc;
    }
    label {
      display: block;
      margin: 15px 0 5px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 1em;
    }
    button {
      background-color: #00ffcc;
      color: black;
      border: none;
      padding: 15px;
      width: 100%;
      border-radius: 10px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #00e6b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Film Generator</h1>
    <form>
      <label for="filmName">Izina rya Film</label>
      <input type="text" id="filmName" placeholder="Urugero: Ibihe bya nyuma" required />

      <label for="prompt">Sobanura igitekerezo cyawe</label>
      <textarea id="prompt" rows="5" placeholder="Shyiramo igitekerezo cya film yawe..." required></textarea>

      <label for="genre">Hitamo Genre</label>
      <select id="genre">
        <option>Science Fiction</option>
        <option>Drama</option>
        <option>Adventure</option>
        <option>Horror</option>
        <option>Fantasy</option>
      </select>

      <label for="image">Shyiramo Ifoto y’Umukinnyi (optional)</label>
      <input type="file" id="image" accept="image/*" />

      <label for="duration">Igihe cya Film (iminota)</label>
      <input type="number" id="duration" placeholder="Urugero: 10" required />

      <button type="submit">Tangira Gukora Film na AI</button>
    </form>
  </div>
</body>
</html>￼Enter
